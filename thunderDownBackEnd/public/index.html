<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thunder Down </title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at top, #1a0000, #000);
        color: #fff;
        overflow: hidden;
      }

      /* Partículas animadas */
      body::before {
        content: "";
        position: absolute;
        width: 200%;
        height: 200%;
        background: repeating-radial-gradient(
          circle,
          rgba(255, 0, 0, 0.1) 0px,
          rgba(255, 0, 0, 0.1) 2px,
          transparent 2px,
          transparent 40px
        );
        animation: moveBg 20s linear infinite;
      }

      @keyframes moveBg {
        from {
          transform: translate(0, 0);
        }
        to {
          transform: translate(-200px, -200px);
        }
      }

      .container {
        position: relative;
        background: rgba(0, 0, 0, 0.7);
        border: 1px solid rgba(255, 0, 0, 0.3);
        border-radius: 15px;
        padding: 40px;
        text-align: center;
        backdrop-filter: blur(10px);
        box-shadow: 0 0 40px rgba(255, 0, 0, 0.3);
        animation: fadeIn 1.5s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      h1 {
        font-size: 2.8rem;
        color: #ff1a1a;
        text-transform: uppercase;
        margin-bottom: 10px;
        letter-spacing: 2px;
        animation: glow 2s infinite alternate;
      }

      @keyframes glow {
        from {
          text-shadow: 0 0 10px #ff0000;
        }
        to {
          text-shadow: 0 0 25px #ff0000, 0 0 50px #ff3333;
        }
      }

      p {
        font-size: 1.1rem;
        margin: 10px 0;
        color: #ddd;
      }

      code {
        background: #111;
        border: 1px solid #ff0000;
        padding: 6px 10px;
        border-radius: 6px;
        color: #ff4d4d;
        font-weight: bold;
      }

      .btn {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 20px;
        border: 1px solid #ff0000;
        border-radius: 8px;
        color: #fff;
        text-decoration: none;
        transition: 0.3s;
      }

      .btn:hover {
        background: #ff0000;
        box-shadow: 0 0 15px #ff0000;
      }

      @media (max-width: 600px) {
        .container {
          padding: 25px;
        }

        h1 {
          font-size: 2rem;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>🔥 Backend Online</h1>

      <p>Bem-vindo ao <strong>Thunder Down Backend</strong></p>

      <p>Este é o backend do aplicativo de download de música.</p>

      <p>Verifique se a URL está correta.</p>

      <p>
        Teste o servidor em <code>/ping</code>
      </p>

      <a href="/ping" class="btn">Verificar Status</a>
    </div>
  </body>
</html>
